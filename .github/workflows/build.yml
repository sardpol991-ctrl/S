name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources
        run: for f in *.zip; do unzip -q -o "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: DarkPassenger/pom.xml
      - name: Build
        working-directory: DarkPassenger
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: DarkPassenger
          path: DarkPassenger/target/DarkPassenger-*.jar
